name: CI

on:
  push:
    branches: [main]
    paths: ["gcp/**", "nextjs/**", "pnpm-lock.yaml", ".github/workflows/ci-cd.yml"]
  pull_request:
    branches: [main]
    paths: ["gcp/**", "nextjs/**", "pnpm-lock.yaml", ".github/workflows/ci-cd.yml"]
  workflow_dispatch:

jobs:
  gcp-bun-test:
    name: gcp bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: gcp
      # Separate processes: task-queue-cascade mock.module()s ../db, which leaks into sqlite.test.ts
      - run: bun test src/db/sqlite.test.ts
        working-directory: gcp
      - run: bun test src/services/task-queue-cascade.test.ts
        working-directory: gcp
      - run: bun test src/app-auth.test.ts
        working-directory: gcp

  gcp-vitest:
    name: gcp vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
        working-directory: gcp

  gcp-tsc:
    name: gcp tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
        working-directory: gcp

  nextjs-build:
    name: nextjs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: nextjs
