version: '3.8'

services:
  # Cloud Tasks Emulator
  # Mimics Google Cloud Tasks for local development
  cloud-tasks-emulator:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    container_name: cloud-tasks-emulator
    ports:
      - "8123:8123"
    command: ["-host", "0.0.0.0", "-port", "8123", "-queue", "projects/local-project/locations/us-central1/queues/calendar-sync-queue"]
    networks:
      - calendar-merge-local
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8123"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  calendar-merge-local:
    driver: bridge
